name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

  admin-backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: admin-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Audit backend dependencies
        run: npm audit --audit-level=high

  smoke-health:
    runs-on: ubuntu-latest
    needs: admin-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-backend/package-lock.json

      - name: Install backend dependencies
        working-directory: admin-backend
        run: npm ci

      - name: Start backend and probe health
        working-directory: admin-backend
        run: |
          npx tsx src/index.ts &
          SERVER_PID=$!
          sleep 3
          curl -fsS http://localhost:4000/api/v2/health | tee health.json
          grep -q '"ok":true' health.json
          kill $SERVER_PID
